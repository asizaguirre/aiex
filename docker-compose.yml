services:
  alex-platform-v2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: alex-platform-v2:latest
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b}
    volumes:
      - ./db:/IA/workspace/alex-platform-v2/db
      - ./rag:/IA/workspace/alex-platform-v2/rag
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    command: ["serve"]

volumes:
  ollama-data:
